name: Menu Studio review checks (no deployment)
on:
  pull_request:
    paths:
      - index.html
      - security-app.js
      - security/**
      - scripts/**
      - .github/workflows/**
      - wrangler.toml
      - .gitignore
      - docs/**
      - README.md
  workflow_dispatch:

# Avoid redundant push + pull-request runs and cancel stale checks.
concurrency:
  group: menustudio-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Menu Studio without deploying
        run: node scripts/test-menu-studio-review.mjs
